<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link="stylesheet" 
  href="https://cdn.jsdelirv.net/npm/bulma@1.0.4/css/bulma.min.css"
  />
</head>
<body>

  <section class="section">
    <div class="contener">
      <div class="columns is-centered">
        <div class="column is-half">

          <form action="" autocomplete="off" class="box" id="formulario">
            <div class="field">
              <label for="apellidos">apellidos</label>
              <input 
                type="text" 
                class="input" 
                id="apellidos" 
                minlength="3" required>
            </div>

            <div class="field">
              <label for="nombres">Nombres</label>
              <input 
                type="text" 
                class="input" 
                id="nombres" 
                minlength="3" required>
            </div>

          <div class="field">
            <label for="fechanac">Fecha nacimientos</label>
            <input 
              type="date" 
              class="input" 
              id="fechanac" 
              min="1990-12-31" 
              max="2026-10-20" required>
          </div>

          <div class="field">
            <label for="email">Correo electrónico</label>
            <input 
              type="email" 
              class="input" 
              id="email" required>
          </div>

          <div class="field">
            <label for="experiencia">Experiencia</label>
            <input 
              type="number" 
              class="input" 
              min="0" 
              max="30" 
              id="experiencia">
          </div>

    
          <div class="field">
            <label for="cargo">Cargo</label>
            <div class="select is-fullwidth">
              <select name="cargo" id="cargo">
                <option value=""></option>
                <option value="1">Analista</option>
                <option value="2">Programador</option>
                <option value="3">Jefe</option>
              </select>
            </div>
          </div>

          <div>
            <button class="button" type="submit">Enviar</button>
            <button class="button" type="reset">Reiniciar</button>
          </div>

          </form>
        </div>
      </div>
    </div>
  </section>

  <script>
    //Vamos a detener el evento submit (envio)
    //El evento submit está asociado al formulario y NO al botón
    const formulario = document.getElementById("formulario")

    formulario.addEventListener("submit", function (){
      event.preventDefault()

      if (confirm("¿Está seguro de procede?")){
        alert("guardado correctamente...")
      }
    })
  </script>

</body>
</html>
